[package]
name = "urlshort-server"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
dotenvy = "0.15.7"
futures = "0.3.34"
log = "0.4.34"
mime_guess = "2.0.5"
rand = "0.10.2"
redis = { version = "1.5.0", features = [
    "connection-manager",
    "cluster-async",
    "tokio-comp",
    "aio",
] }
rust-embed = { version = "8.12.0", features = ["axum", "mime-guess"] }
scylla = "1.9.0"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
validator = { version = "0.21.0", features = ["derive"] }
