[package]
name = "urlshort-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-macros = "0.5.1"
dotenvy = "0.15.7"
log = "0.4.34"
rand = "0.10.2"
redis = { version = "1.5.0", features = [
    "connection-manager",
    "cluster-async",
    "tokio-comp",
    "aio",
] }
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.9", features = [
    "postgres",
    "runtime-tokio",
    "macros",
    "time",
] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
validator = { version = "0.21.0", features = ["derive"] }
