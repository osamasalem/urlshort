name: urlshort

services:
  nginx:
    image: nginx
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      urlshort-server-1:
        condition: service_healthy
      urlshort-server-2:
        condition: service_healthy
      urlshort-server-3:
        condition: service_healthy

  pgsql:
    image: postgres
    container_name: postgres
    environment:
        POSTGRES_USER: dbuser
        POSTGRES_DB: urlshort
        POSTGRES_PASSWORD: dbpass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d urlshort"]
      interval: 1s
      timeout: 10s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis
    container_name: redis
    command: redis-server --requirepass redis_pass --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  urlshort-server-1:
    image: urlshort-server
    container_name: urlshort-server-1
    environment:
      DATABASE_URL: postgresql://dbuser:dbpass@pgsql/urlshort
      REDIS_URL: redis://redis/
      LISTEN_HOST: 0.0.0.0:80
      PUBLIC_URL: http://localhost/
    ports:
      - "8081:80"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  urlshort-server-2:
    container_name: urlshort-server-2
    image: urlshort-server
    environment:
      DATABASE_URL: postgresql://dbuser:dbpass@pgsql/urlshort
      REDIS_URL: redis://redis/
      LISTEN_HOST: 0.0.0.0:80
      PUBLIC_URL: http://localhost/
    ports:
      - "8082:80"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s


  urlshort-server-3:
    container_name: urlshort-server-3
    image: urlshort-server
    environment:
      DATABASE_URL: postgresql://dbuser:dbpass@pgsql/urlshort
      REDIS_URL: redis://redis/
      LISTEN_HOST: 0.0.0.0:80
      PUBLIC_URL: http://localhost/
    ports:
      - "8083:80"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s


volumes:
  postgres_data:
  redis_data:
