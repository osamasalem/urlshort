name: urlshort

services:
  pgsql:
    image: postgres
    container_name: postgres
    environment:
        POSTGRES_USER: dbuser
        POSTGRES_DB: urlshort
        POSTGRES_PASSWORD: dbpass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlshort"]
      interval: 1s
      timeout: 10s
      retries: 5
    volumes:
      - postgres_data: ./

  redis:
    image: redis
    container_name: redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  urlshort-server:
    container_name: urlshort-server
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://dbuser:dbpass@pgsql/urlshort
      REDIS_URL: redis://redis/
      LISTEN_HOST: 0.0.0.0:80
      PUBLIC_URL: http://localhost/
    ports:
      - "80:80"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  postgres_data:
