user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log formats for security tracking
    log_format main '$remote_addr => $upstream_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Basic Optimizations & Security Headers
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Disables Nginx version signature (firewall best practice)

    # ==========================================
    # 1. FIREWALL & ADVANCED SECURITY MITIGATIONS
    # ==========================================

    # Block specific bad user agents / bots
    map $http_user_agent $bad_bot {
        default 0;
        ~*(wget|curl|libwww-perl|python|nikto|sqlmap|dirbuster) 1;
    }

    # ==========================================
    # 2. RATE LIMITING & CONNECTION THROTTLING
    # ==========================================

    # Rate limit zone: 10MB zone tracks ~160k IPs, allows 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=10r/s;

    # Connection limit zone: Restrict the maximum simultaneous connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit_zone:10m;

    # Customize the error code returned when rate/connection limits are hit
    limit_req_status 429;
    limit_conn_status 429;

    # ==========================================
    # 3. LOAD BALANCING (UPSTREAM CLUSTER)
    # ==========================================
    upstream urlshort-server {
        # Least connections algorithm is optimal for varied load distributions
        least_conn;

        # Backend pool nodes
        server urlshort-server-1:80 max_fails=3 fail_timeout=10s;
        server urlshort-server-2:80 max_fails=3 fail_timeout=10s;
        # server urlshort-server-3:80 max_fails=3 fail_timeout=10s;

        keepalive 32; # Keep-alive connections to backends to improve throughput
    }

    server
    {
        listen 8080;

        location = /stub_status {
            stub_status;
            access_log off;
        }
    }

    server {
        listen 80;
        server_name localhost;

        # Redirect all HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================
    # 4. VIRTUAL SERVER
    # ==========================================
    server {
        listen 443 ssl;
        server_name localhost;

        # Inside-container paths to the certificate and key
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Firewall block for bad bots defined in the map directive above
        if ($bad_bot) {
            return 403;
        }

        # Block common exploitation attempts (SQL Injection, XSS)
        if ($request_uri ~* "(\.\./|--|\'|\"|concat|eval|script)") {
            return 400;
        }

        # Global location block
        location / {
            # Apply connection throttling: Max 15 concurrent TCP connections per IP
            limit_conn conn_limit_zone 15;

            # Apply rate limiting: Allow temporary traffic spikes up to 20 requests without delay
            limit_req zone=api_limit_zone burst=20 nodelay;

            # Proxy headers to ensure real client info reaches backend nodes
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward traffic to the load balanced cluster
            proxy_pass http://urlshort-server;

            # Timeouts as firewall safeguard against Slowloris attacks
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Custom error page for rate limiting
        error_page 429 /429.html;
        location = /429.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
